[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remin-worker"
version = "0.1.0"
description = "拾忆本地文档处理 Worker"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.1",
  "onnxruntime==1.27.0",
  "pypdf==6.14.2",
  "tokenizers==0.23.1",
]

[project.scripts]
remin-worker = "remin_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["remin_worker*"]
