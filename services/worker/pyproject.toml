[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fanfan-worker"
version = "0.2.0"
description = "翻翻本地文档处理 Worker"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.1",
  "onnxruntime==1.23.2",
  "pypdf==6.14.2",
  "rapidocr==3.9.2",
  "sherpa-onnx==1.13.4",
  "tokenizers==0.23.1",
]

[project.scripts]
fanfan-worker = "fanfan_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fanfan_worker*"]
